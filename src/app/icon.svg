<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    2026-09-22 のデザインの作り直しで配色を変えた。
    サイトの帯の四角い印と同じ「信号オレンジの地に墨色」（コントラスト 5.92:1）。
    ブラウザのタブが明るくても暗くても埋もれない。
  -->
  <rect width="32" height="32" fill="#ff5a1f"/>
  <!-- 錨（アンカー）を簡略化した形。サイト名の由来 -->
  <g stroke="#121416" stroke-width="2.6" fill="none" stroke-linecap="round">
    <path d="M16 9v15"/>
    <path d="M10 14h12"/>
    <path d="M8 19a8 8 0 0 0 16 0"/>
  </g>
  <circle cx="16" cy="7" r="2.6" fill="none" stroke="#121416" stroke-width="2.6"/>
</svg>
